{% extends "base.html" %}
{% block title %}Masuk — DGI Proxy{% endblock %}
{% block body %}
<div class="authbox">
  <h2>Masuk</h2>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>username
      <input type="text" name="username" required autocomplete="username" maxlength="64" autofocus>
    </label>
    <label>password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Masuk</button>
  </form>
</div>
{% endblock %}
